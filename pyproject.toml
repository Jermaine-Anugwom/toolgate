[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolgate"
version = "0.1.0"
description = "Permissioned agent tools with dry runs, approvals, and replay safety."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.6,<1"]

[project.scripts]
toolgate = "toolgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
